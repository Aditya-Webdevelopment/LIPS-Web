<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Learn India Public School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body class="bg-white selection:bg-orange-100">

    <header class="flex items-center justify-between px-8 md:px-16 py-5 sticky top-0 bg-white/90 backdrop-blur-md z-50 border-b border-slate-100">
        <div class="flex items-center gap-3">
            <img src="srcs/logo.png" alt="LIPS Logo" class="h-12 w-auto object-contain">
            <h2 class="text-xl font-bold text-blue-900 tracking-tighter">Learn India <span class="text-orange-500">Public School</span></h2>
        </div>
        <nav class="hidden lg:flex items-center gap-8 font-semibold text-slate-500">
            <a href="index.html" class="nav-link hover:text-blue-900 transition-colors">Home</a>
            <a href="about.html" class="nav-link hover:text-blue-900 transition-colors">About</a>
            <a href="classes.html" class="nav-link hover:text-blue-900 transition-colors">Classes</a>
            <a href="Admission.html" class="nav-link hover:text-blue-900 transition-colors">Admission</a>
            <a href="faculties.html" class="nav-link hover:text-blue-900 transition-colors">Faculties</a>
            <a href="gallery.html" class="nav-link hover:text-blue-900 transition-colors">Gallery</a>
            <a href="contact.html" class="nav-link text-blue-900 border-b-2 border-orange-500">Contact</a>
        </nav>
        <a href="notice.html" class="bg-orange-500 text-white px-7 py-2.5 rounded-full font-bold hover:bg-blue-900 transition-all shadow-md">Notice</a>
    </header>

    <section class="max-w-7xl mx-auto px-6 py-20">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
            
            <div class="bg-slate-50 p-8 md:p-12 rounded-[2.5rem] relative overflow-hidden shadow-sm">
                
                <div id="success-overlay" class="hidden absolute inset-0 bg-white/95 z-20 flex flex-col items-center justify-center text-center p-8 animate-in fade-in zoom-in duration-300">
                    <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-5xl mb-4">✓</div>
                    <h2 class="text-2xl font-black text-blue-900 uppercase">Message Sent!</h2>
                    <p class="text-slate-500 mt-2">Thank you, Aditya. We will get back to you shortly.</p>
                    <button onclick="resetForm()" class="mt-6 text-blue-900 font-bold underline">Send another message</button>
                </div>

                <div id="form-content">
                    <h2 class="text-3xl font-black text-blue-900 mb-6 uppercase">Get In <span class="text-orange-500">Touch</span></h2>
                    <form id="contact-form" class="space-y-6">
                        <div>
                            <label class="block text-xs font-black text-slate-400 uppercase mb-2 ml-1">Full Name</label>
                            <input type="text" name="user_name" id="user_name" required class="w-full px-6 py-4 rounded-2xl border-2 border-white focus:border-blue-900 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-black text-slate-400 uppercase mb-2 ml-1">Email Address</label>
                            <input type="email" name="user_email" id="user_email" required class="w-full px-6 py-4 rounded-2xl border-2 border-white focus:border-blue-900 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-black text-slate-400 uppercase mb-2 ml-1">Message</label>
                            <textarea name="message" id="message" rows="5" required class="w-full px-6 py-4 rounded-2xl border-2 border-white focus:border-blue-900 outline-none transition-all"></textarea>
                        </div>
                        <button type="submit" id="submit-btn" class="w-full bg-blue-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-orange-500 transition-all shadow-xl">
                            <span id="btn-text">Send Message</span>
                        </button>
                    </form>
                </div>
            </div>

            <div class="space-y-12">
                <h2 class="text-3xl font-black text-blue-900 uppercase">Our <span class="text-orange-500">Office</span></h2>
                <div class="space-y-6">
                    <p class="font-bold text-slate-600 leading-relaxed">Vill-Fatepur, P.s-Uluberia, Dist-Howrah, Pin-711315</p>
                    <p class="text-orange-500 font-black text-2xl">+91 7003663576</p>
                    <p class="text-blue-900 font-bold uppercase tracking-widest text-sm">Mon - Sat: 09:00 AM - 02:00 PM</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Initialize EmailJS with your Public Key
        (function() {
            emailjs.init("YOUR_PUBLIC_KEY"); 
        })();

        const contactForm = document.getElementById('contact-form');
        const successOverlay = document.getElementById('success-overlay');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');

        contactForm.addEventListener('submit', function(event) {
            event.preventDefault();
            btnText.innerText = "Sending...";
            submitBtn.disabled = true;

            // These IDs come from your EmailJS Dashboard
            emailjs.sendForm('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', this)
                .then(function() {
                    successOverlay.classList.remove('hidden');
                }, function(error) {
                    alert("FAILED to send message. Check your EmailJS settings.");
                    btnText.innerText = "Send Message";
                    submitBtn.disabled = false;
                });
        });

        function resetForm() {
            contactForm.reset();
            successOverlay.classList.add('hidden');
            btnText.innerText = "Send Message";
            submitBtn.disabled = false;
        }
    </script>
</body>
</html>
