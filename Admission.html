<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form | Learn India Public School</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 selection:bg-orange-100">

    <header class="flex items-center justify-between px-8 md:px-16 py-5 sticky top-0 bg-white/90 backdrop-blur-md z-50 border-b border-slate-100">
    
    <div class="flex items-center gap-3">
        <img src="srcs/logo.png" alt="LIPS Logo" class="h-12 w-auto object-contain">
        
        <h2 class="text-xl font-bold text-blue-900 tracking-tighter">
            Learn India <span class="text-orange-500">Public School</span>
        </h2>
    </div>

    <nav class="hidden lg:flex items-center gap-8 font-semibold text-slate-500">
        <a href="index.html" class="nav-link hover:text-blue-900 transition-colors">Home</a>
        <a href="about.html" class="nav-link hover:text-blue-900 transition-colors">About</a>
        <a href="classes.html" class="nav-link hover:text-blue-900 transition-colors">Classes</a>
        <a href="Admission.html" class="nav-link hover:text-blue-900 transition-colors">Admission</a>
        <a href="faculties.html" class="nav-link hover:text-blue-900 transition-colors">Faculties</a>
        <a href="gallery.html" class="nav-link hover:text-blue-900 transition-colors">Gallery</a>
        
        <div class="relative group">
            <a href="#" class="nav-link flex items-center gap-1 hover:text-blue-900 transition-colors">
                Course
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </a>
        </div>

        <a href="contact.html" class="nav-link hover:text-blue-900 transition-colors">Contact</a>
    </nav>

    <a href="notice.html" class="bg-orange-500 text-white px-7 py-2.5 rounded-full font-bold hover:bg-blue-900 transition-all shadow-md">
        Notice
    </a>
</header>

    <section class="bg-blue-900 py-16 text-center text-white">
        <h1 class="text-4xl md:text-5xl font-black uppercase tracking-tight">Student <span class="text-orange-400">Admission</span></h1>
        <p class="text-blue-200 mt-2 font-medium tracking-widest">JOIN LIPS FOR THE ACADEMIC SESSION 2026-27</p>
    </section>

    <section class="max-w-5xl mx-auto px-6 py-16">
        <div class="bg-white rounded-[3rem] shadow-2xl p-8 md:p-14 border border-slate-100">
            
            <form action="#" method="POST" class="space-y-12">
                
                <div class="space-y-8">
                    <div class="flex items-center gap-4">
                        <span class="w-10 h-10 bg-blue-900 text-white rounded-full flex items-center justify-center font-bold">01</span>
                        <h2 class="text-2xl font-black text-blue-950 uppercase tracking-tight">Personal Details</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase ml-2">First Name</label>
                            <input type="text" placeholder="e.g. Aditya" class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-900 outline-none transition-all bg-slate-50 focus:bg-white">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase ml-2">Last Name</label>
                            <input type="text" placeholder="e.g. Balmiki" class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-900 outline-none transition-all bg-slate-50 focus:bg-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase ml-2">Date of Birth</label>
                            <input type="date" class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-900 outline-none bg-slate-50">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase ml-2">Gender</label>
                            <div class="flex gap-8 py-3">
                                <label class="flex items-center gap-3 cursor-pointer group">
                                    <input type="radio" name="gender" class="w-5 h-5 accent-orange-500">
                                    <span class="font-bold text-slate-600 group-hover:text-blue-900">Male</span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer group">
                                    <input type="radio" name="gender" class="w-5 h-5 accent-orange-500">
                                    <span class="font-bold text-slate-600 group-hover:text-blue-900">Female</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-8 pt-8 border-t border-slate-100">
                    <div class="flex items-center gap-4">
                        <span class="w-10 h-10 bg-orange-500 text-white rounded-full flex items-center justify-center font-bold">02</span>
                        <h2 class="text-2xl font-black text-blue-950 uppercase tracking-tight">Contact & Address</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase ml-2">Email Address</label>
                            <input type="email" placeholder="student@mail.com" class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-900 outline-none transition-all bg-slate-50">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-black text-slate-400 uppercase ml-2">Mobile Number</label>
                            <input type="tel" placeholder="+91 70036 63576" class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-900 outline-none transition-all bg-slate-50">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase ml-2">Full Address</label>
                        <textarea rows="3" placeholder="Vill-Fatepur, Uluberia, Howrah..." class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 focus:border-blue-900 outline-none bg-slate-50"></textarea>
                    </div>
                </div>

                <div class="space-y-8 pt-8 border-t border-slate-100">
                    <div class="flex items-center gap-4">
                        <span class="w-10 h-10 bg-blue-900 text-white rounded-full flex items-center justify-center font-bold">03</span>
                        <h2 class="text-2xl font-black text-blue-950 uppercase tracking-tight">Academic Selection</h2>
                    </div>
                    
                    <div class="max-w-md space-y-2">
                        <label class="text-xs font-black text-slate-400 uppercase ml-2">Select Grade/Class</label>
                        <select class="w-full px-6 py-4 rounded-2xl border-2 border-slate-100 focus:border-orange-500 outline-none bg-white font-bold text-slate-700 appearance-none">
                            <option>Nursery / LKG / UKG</option>
                            <option>Class 1 - 5</option>
                            <option>Class 6 - 9</option>
                        </select>
                    </div>
                </div>

                <div class="pt-10">
                    <button type="submit" class="bg-blue-900 text-white w-full py-5 rounded-[2rem] font-black text-xl shadow-2xl hover:bg-orange-500 transition-all duration-300 hover:-translate-y-1">
                        Submit Application
                    </button>
                    <p class="text-center text-slate-400 text-[10px] mt-6 tracking-widest uppercase">Learn India Public School Admission Portal &copy; 2026</p>
                </div>

            </form>
        </div>
    </section>

</body>
</html>
